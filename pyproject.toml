[project]
name = "eu5-world-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "rasterio",
    "pandas",
    "rdata",
    "requests",
    "matplotlib",
    "pyshp>=3.1.6",
    "scipy>=1.17.1",
    "netcdf4>=1.7.4",
    "pyarrow>=25.0.1",
    "shapely>=2.1.2",
    "access-parser==0.0.6",
    "openpyxl>=3.1.5",
    "libarchive-c>=5.3",
    "osqp>=1.1.3",
]
[project.scripts]
worldbuilder = "historical_agriculture.cli:main"
ha1300 = "historical_agriculture.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/historical_agriculture"]
[dependency-groups]
dev = ["pytest"]
